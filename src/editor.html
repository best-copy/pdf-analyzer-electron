<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>내부 편집기 — PDF 분석기</title>
  <script src="./libs/pdf.min.js"></script>
  <script src="./libs/pdf-lib.min.js"></script>
  <script src="./libs/fontkit.umd.min.js"></script>
  <style>
    :root { --bar:#2c2c2e; --panel:#f3f4f6; --accent:#6e6e73; --sel:#48484a; }
    * { box-sizing:border-box; }
    html,body { margin:0; height:100%; font-family:'Segoe UI','Malgun Gothic',sans-serif; overflow:hidden; background:#e5e7eb; }
    #app { display:flex; flex-direction:column; height:100vh; }

    /* 상단 툴바 */
    #toolbar { display:flex; align-items:center; gap:6px; padding:6px 10px; background:var(--bar); color:#fff; flex:0 0 auto; flex-wrap:wrap; }
    #toolbar .grp { display:flex; align-items:center; gap:4px; padding:0 6px; border-right:1px solid #48484a; }
    #toolbar .grp:last-child { border-right:none; }
    .tbtn { background:#48484a; color:#fff; border:none; border-radius:6px; padding:6px 9px; font-size:13px; cursor:pointer; min-width:34px; }
    .tbtn:hover { background:#5a5a5f; }
    .tbtn.active { background:#ffd60a; color:#1d1d1f; }
    .tbtn:disabled { opacity:.4; cursor:default; }
    .tbtn.save { background:#48484a; } .tbtn.save:hover{ background:#5a5a5f; }
    .tbtn.cancel { background:#6b7280; }
    #toolbar label { font-size:12px; color:#cbd5e1; }
    #toolbar input[type=number]{ width:64px; padding:3px 4px; border-radius:4px; border:1px solid #5a5a5f; }
    #pageLabel { font-size:13px; min-width:90px; text-align:center; }

    /* 본체 */
    #body { flex:1 1 auto; display:flex; min-height:0; }
    #pagesPane { flex:0 0 132px; background:#111827; overflow-y:auto; padding:8px; }
    .pthumb { width:100%; border:2px solid transparent; border-radius:4px; margin-bottom:8px; cursor:pointer; background:#fff; display:block; }
    .pthumb.cur { border-color:var(--accent); }
    .pthumb-num { color:#9ca3af; font-size:11px; text-align:center; margin-top:-4px; margin-bottom:6px; }
    .pthumb-num.edited { color:#cbd5e1; font-weight:700; }

    #stageWrap { flex:1 1 auto; overflow:auto; position:relative; display:flex; align-items:flex-start; justify-content:center; padding:24px; }
    #stage { position:relative; box-shadow:0 4px 24px rgba(0,0,0,.25); background:#fff; flex:0 0 auto; }
    #pageCanvas { display:block; }
    #overlay { position:absolute; inset:0; overflow:hidden; }
    #marquee { position:absolute; border:1px dashed var(--sel); background:rgba(72,72,74,.08); display:none; pointer-events:none; }

    .obj { position:absolute; transform-origin:center center; cursor:move; }
    .obj.selected { outline:1.5px solid var(--sel); }
    .obj-text, .obj-redact { padding:0; line-height:1.05; white-space:pre-wrap; word-break:break-word; overflow:hidden; }
    .obj-redact { }
    .obj-text[contenteditable], .obj-redact[contenteditable] { outline:none; }
    .obj-rect { }
    .obj-image img { width:100%; height:100%; display:block; }
    .obj-image { overflow:hidden; }
    .obj-mosaic { overflow:hidden; outline:1px dashed #f59e0b; }
    .obj-shape svg { display:block; overflow:visible; }
    /* 도형 팔레트 팝오버 */
    #shapePalette { position:absolute; z-index:100; background:#2c2c2e; border:1px solid #48484a; border-radius:8px; padding:8px; display:none; grid-template-columns:repeat(7,36px); gap:5px; box-shadow:0 10px 30px rgba(0,0,0,.55); max-height:70vh; overflow-y:auto; }
    #shapePalette.open { display:grid; }
    #shapePalette button { width:36px; height:36px; background:#3a3a3c; border:1.5px solid transparent; border-radius:6px; cursor:pointer; padding:5px; display:flex; align-items:center; justify-content:center; }
    #shapePalette button:hover { background:#48484a; }
    #shapePalette button.sel { border-color:#ffd60a; background:#48484a; }
    #shapePalette button svg { width:100%; height:100%; display:block; stroke:#e8e8ed; fill:none; }

    /* 핸들 */
    .handle { position:absolute; width:10px; height:10px; background:#fff; border:1.5px solid var(--sel); border-radius:2px; }
    .handle.rot { border-radius:50%; background:var(--sel); cursor:grab; }
    .handle.crop { background:#f59e0b; border-color:#b45309; }
    /* 모서리 바깥 회전존 — 보이지 않는 넓은 히트영역, 회전 커서 */
    .handle.rotzone { width:20px; height:20px; background:transparent; border:none;
      cursor:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20"><path d="M10 3a7 7 0 1 1-6.6 4.7" fill="none" stroke="black" stroke-width="2"/><path d="M2.2 3.2 3.6 8l4.6-1.6z" fill="black"/></svg>') 10 10, grab; }

    /* 우측 속성 패널 */
    #props { flex:0 0 232px; background:var(--panel); overflow-y:auto; padding:12px; font-size:12px; }
    #props h3 { margin:0 0 8px; font-size:13px; }
    #props .row { display:flex; align-items:center; gap:6px; margin-bottom:8px; }
    #props .row label { flex:0 0 62px; color:#48484a; }
    #props input, #props select { flex:1; padding:4px 6px; border:1px solid #cbd5e1; border-radius:4px; min-width:0; }
    #props .hint { color:#6b7280; line-height:1.5; }
    #props .sep { border-top:1px solid #d1d5db; margin:10px 0; }
    #props .mini { display:flex; gap:6px; }
    #props .mini button { flex:1; padding:5px; border:none; border-radius:4px; background:#e5e7eb; cursor:pointer; }
    #props .mini button:hover { background:#d1d5db; }

    #status { position:fixed; left:50%; bottom:12px; transform:translateX(-50%); background:#111827cc; color:#fff; padding:8px 16px; border-radius:8px; font-size:13px; display:none; z-index:50; }
    #busy { position:fixed; inset:0; background:#0008; color:#fff; display:none; align-items:center; justify-content:center; font-size:16px; z-index:60; }
  </style>
</head>
<body>
<div id="app">
  <div id="toolbar">
    <div class="grp">
      <button class="tbtn" id="tool-select" title="선택/이동 (V)" onclick="setTool('select')">▧</button>
      <button class="tbtn" id="tool-text"   title="텍스트 삽입 (T)" onclick="setTool('text')">T</button>
      <button class="tbtn" id="tool-edit"   title="기존 텍스트 편집 (E)" onclick="setTool('edit')">✎</button>
      <button class="tbtn" id="tool-image"  title="이미지 삽입 (I)" onclick="pickImage()">🖼</button>
      <button class="tbtn" id="tool-line"   title="선 (L)" onclick="setTool('line')">╱</button>
      <button class="tbtn" id="tool-shape"  title="사각형·도형 팔레트 (R/S)" onclick="toggleShapePalette(event)">⬠</button>
      <button class="tbtn" id="tool-mosaic" title="모자이크(민감정보 가림) (M)" onclick="setTool('mosaic')">▦</button>
      <button class="tbtn" id="tool-region" title="원본 그림·로고·도표 편집: 클릭 또는 드래그로 추출 (G)" onclick="setTool('region')">◲</button>
    </div>
    <div class="grp">
      <button class="tbtn" id="btn-group"   title="그룹 (Ctrl+G)" onclick="groupSelection()">⧉</button>
      <button class="tbtn" id="btn-ungroup" title="그룹 해제 (Ctrl+Shift+G)" onclick="ungroupSelection()">⧉̸</button>
      <button class="tbtn" title="자르기 모드 (C)" id="btn-crop" onclick="toggleCrop()">⛶</button>
    </div>
    <div class="grp">
      <label>정밀회전</label>
      <button class="tbtn" title="-0.1° ( [ )" onclick="rotateSelection(-0.1)">−</button>
      <input type="number" id="rotStep" value="0.1" step="0.1" min="0" style="width:52px">
      <button class="tbtn" title="+0.1° ( ] )" onclick="rotateSelection(+0.1)">+</button>
    </div>
    <div class="grp">
      <label>페이지회전</label>
      <button class="tbtn" title="페이지 전체 -0.1° (스캔 기울기 보정)" onclick="rotatePage(-0.1)">⟲</button>
      <input type="number" id="pageRotInput" value="0" step="0.1" style="width:56px" onchange="setPageRot(this.value)" title="스캔 PDF 기울기 보정 각도(도)">
      <button class="tbtn" title="페이지 전체 +0.1°" onclick="rotatePage(0.1)">⟳</button>
    </div>
    <div class="grp">
      <button class="tbtn" title="실행취소 (Ctrl+Z)" onclick="undo()">↶</button>
      <button class="tbtn" title="다시실행 (Ctrl+Y)" onclick="redo()">↷</button>
      <button class="tbtn" title="삭제 (Del)" onclick="deleteSelection()">🗑</button>
    </div>
    <div class="grp">
      <button class="tbtn" title="축소" onclick="zoomBy(-1)">－</button>
      <span id="zoomLabel" style="font-size:12px;min-width:42px;text-align:center">100%</span>
      <button class="tbtn" title="확대" onclick="zoomBy(1)">＋</button>
    </div>
    <div class="grp">
      <button class="tbtn" title="이전 페이지" onclick="gotoPage(curPos-1)">◀</button>
      <span id="pageLabel">-</span>
      <button class="tbtn" title="다음 페이지" onclick="gotoPage(curPos+1)">▶</button>
    </div>
    <div class="grp" style="margin-left:auto">
      <button class="tbtn save" title="저장하고 닫기 (Ctrl+S)" onclick="saveAndClose()">💾 저장하고 닫기</button>
      <button class="tbtn cancel" title="취소 (Esc)" onclick="cancelClose()">✕ 취소</button>
    </div>
  </div>

  <div id="body">
    <div id="pagesPane"></div>
    <div id="stageWrap">
      <div id="stage">
        <canvas id="pageCanvas"></canvas>
        <div id="overlay">
          <div id="marquee"></div>
        </div>
      </div>
    </div>
    <div id="props"><div class="hint"><b>PDF의 기존 글자를 클릭</b>하면 바로 수정할 수 있습니다(가림 후 재입력). 빈 곳을 클릭하면 새 오브젝트 선택이 해제됩니다.<br><br>
      단축키: <b>V</b> 선택·<b>T</b> 텍스트삽입·<b>E</b> 기존텍스트·<b>I</b> 이미지·<b>R</b> 도형·<b>C</b> 자르기·<b>Ctrl+G</b> 그룹·<b>[</b> <b>]</b> 0.1° 회전·<b>Shift+[ ]</b> 1° 회전·<b>Del</b> 삭제·<b>Ctrl+Z/Y</b> 취소/재실행·<b>Ctrl+S</b> 저장.<br>
      크기조절 시 <b>Shift</b>=비율 고정, 선택 오브젝트 <b>모서리 바깥</b>을 드래그하면 마우스 회전.
    </div></div>
  </div>
</div>
<div id="shapePalette"></div>
<div id="status"></div>
<div id="busy">처리 중…</div>

<script>
// ══════════════════════════════════════════════════════════════════════════
//  페이지 내부 편집기 (별도 창). 원본 페이지 위 오버레이 오브젝트를 편집하고
//  저장 시 각 페이지를 단일페이지 PDF로 구워 메인 창으로 돌려준다.
// ══════════════════════════════════════════════════════════════════════════
const { PDFDocument, StandardFonts, rgb, degrees } = PDFLib;

// pdf.js 워커 (blob URL — asar 안에서도 동작)
try {
  const wc = window.electronAPI.getWorkerContent();
  pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob([wc], { type:'application/javascript' }));
} catch (e) { console.error('pdf.js worker load 실패', e); }

// ── 상태 ────────────────────────────────────────────────────────────────────
let PAYLOAD = null;
let origBytes = null;           // 원본 PDF 바이트 (Uint8Array)
let pdfjsDoc = null;            // pdf.js 문서
let pages = [];                 // [{ originalIdx, num }]
let curPos = 0;                 // pages[] 인덱스
let scale = 1;                  // 화면 배율 (device px per view-unit)
let baseScale = 1;              // fit 기준 배율
let models = new Map();         // originalIdx → [obj,...]
let dirtyPages = new Set();     // 변경된 originalIdx
let curPage = null;            // 현재 pdf.js page
let curVp1 = null;             // 현재 페이지 scale=1 뷰포트 (좌표변환용)
let curTextItems = [];         // 현재 페이지 텍스트 아이템 bbox (view-units)
let pageAngles = new Map();     // 페이지 미세회전(스캔 기울기 보정): originalIdx → 각도(도)
let curImageRegions = [];       // 현재 페이지의 네이티브 이미지 영역(view-units) — 클릭해 추출·편집
function curPageAngle(){ return pageAngles.get(pages[curPos].originalIdx) || 0; }
function rotatePage(d){ setPageRot(curPageAngle()+d); }
function setPageRot(v){ v=Math.round((parseFloat(v)||0)*10)/10; pageAngles.set(pages[curPos].originalIdx, v); const inp=document.getElementById('pageRotInput'); if(inp) inp.value=v; applyPageRotDisplay(); markDirty(); }
function applyPageRotDisplay(){ const a=curPageAngle(); if(canvas){ canvas.style.transformOrigin='center center'; canvas.style.transform = a ? `rotate(${a}deg)` : ''; } }
let tool = 'select';
let selectedIds = new Set();
let cropMode = false;
let nextId = 1;
let fontList = [];             // [{name,file}]
let undoStack = [], redoStack = [];
let bgCanvasCtx = null;        // 배경 캔버스(배경색 샘플링용)

const stage = document.getElementById('stage');
const overlay = document.getElementById('overlay');
const canvas = document.getElementById('pageCanvas');
const propsEl = document.getElementById('props');

function curModel() {
  const idx = pages[curPos].originalIdx;
  if (!models.has(idx)) models.set(idx, []);
  return models.get(idx);
}
function setStatus(msg, ms=1600){ const s=document.getElementById('status'); s.textContent=msg; s.style.display='block'; clearTimeout(setStatus._t); if(ms) setStatus._t=setTimeout(()=>s.style.display='none',ms); }
function showBusy(on,msg){ const b=document.getElementById('busy'); if(msg)b.textContent=msg; b.style.display=on?'flex':'none'; }

// ── 부팅 ────────────────────────────────────────────────────────────────────
(async function boot() {
  try {
    PAYLOAD = await window.electronAPI.pullEditorPayload();
    if (!PAYLOAD) { setStatus('편집 데이터를 불러오지 못했습니다.'); return; }
    origBytes = new Uint8Array(window.electronAPI.readFile(PAYLOAD.pdfPath));
    // pdf.js 문서 (사본 전달 — 원본 버퍼는 pdf-lib 굽기에 재사용)
    pdfjsDoc = await pdfjsLib.getDocument({ data: origBytes.slice(0) }).promise;
    pages = (PAYLOAD.order && PAYLOAD.order.length)
      ? PAYLOAD.order.map(o => ({ originalIdx: o.originalIdx, num: o.num }))
      : Array.from({ length: pdfjsDoc.numPages }, (_, i) => ({ originalIdx: i, num: i+1 }));
    // 기존 편집 모델 로드
    const m = PAYLOAD.models || {};
    Object.keys(m).forEach(k => {
      const arr = (m[k]||[]);
      const pa = arr.find(o => o && o.type==='_pageAngle');
      if (pa) pageAngles.set(+k, pa.deg||0);
      models.set(+k, arr.filter(o => o && o.type!=='_pageAngle').map(o => ({ ...o })));   // 각도 마커는 오브젝트로 렌더 안 함
    });
    // 시작 페이지
    curPos = Math.max(0, pages.findIndex(p => p.originalIdx === (PAYLOAD.startIdx|0)));
    if (curPos < 0) curPos = 0;
    try { fontList = await window.electronAPI.listFonts() || []; } catch(e){ fontList=[]; }
    await buildPageThumbs();
    await renderPage();
    window.addEventListener('resize', () => renderPage());
  } catch (e) {
    console.error(e); setStatus('편집기 초기화 오류: ' + (e.message||e), 6000);
  }
})();

// ── 페이지 썸네일(왼쪽) ─────────────────────────────────────────────────────
async function buildPageThumbs() {
  const pane = document.getElementById('pagesPane');
  pane.innerHTML = '';
  for (let i = 0; i < pages.length; i++) {
    const p = pages[i];
    const c = document.createElement('canvas');
    c.className = 'pthumb'; c.dataset.pos = i;
    c.onclick = () => gotoPage(i);
    const num = document.createElement('div');
    num.className = 'pthumb-num'; num.dataset.pos = i;
    num.textContent = (p.num||i+1) + '쪽';
    pane.appendChild(c); pane.appendChild(num);
    // 저용량 렌더
    try {
      const pg = await pdfjsDoc.getPage(p.originalIdx + 1);
      const vp = pg.getViewport({ scale: 0.18, rotation: 0 });
      c.width = Math.ceil(vp.width); c.height = Math.ceil(vp.height);
      await pg.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
    } catch(e){}
  }
  refreshThumbState();
}
function refreshThumbState() {
  document.querySelectorAll('.pthumb').forEach(c => c.classList.toggle('cur', +c.dataset.pos === curPos));
  document.querySelectorAll('.pthumb-num').forEach(n => {
    const idx = pages[+n.dataset.pos].originalIdx;
    n.classList.toggle('edited', (models.get(idx)||[]).length > 0);
  });
}

// ── 현재 페이지 렌더 ─────────────────────────────────────────────────────────
async function renderPage() {
  const p = pages[curPos];
  curPage = await pdfjsDoc.getPage(p.originalIdx + 1);
  curVp1 = curPage.getViewport({ scale: 1, rotation: 0 });   // 좌표변환 기준(원본 방향)
  // fit 배율: stageWrap 크기에 맞춤
  const wrap = document.getElementById('stageWrap');
  const availW = wrap.clientWidth - 60, availH = wrap.clientHeight - 60;
  baseScale = Math.min(availW / curVp1.width, availH / curVp1.height);
  if (!isFinite(baseScale) || baseScale <= 0) baseScale = 1;
  if (!renderPage._userZoom) scale = baseScale;
  const vp = curPage.getViewport({ scale, rotation: 0 });
  canvas.width = Math.ceil(vp.width); canvas.height = Math.ceil(vp.height);
  stage.style.width = canvas.width + 'px'; stage.style.height = canvas.height + 'px';
  await curPage.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
  bgCanvasCtx = canvas.getContext('2d', { willReadFrequently: true });
  // 텍스트 아이템 bbox (기존 텍스트 편집용) — view-units
  curTextItems = [];
  try {
    const tc = await curPage.getTextContent();
    for (const it of tc.items) {
      if (!it.str || !it.str.trim()) continue;
      const tx = pdfjsLib.Util.transform(curVp1.transform, it.transform);
      const fh = Math.hypot(tx[2], tx[3]) || Math.hypot(tx[0], tx[1]);
      if (!fh) continue;
      // 원본 폰트 정보(기존 텍스트 편집 시 실제 문서 폰트 적용용)
      const styleFamily = (tc.styles && tc.styles[it.fontName]) ? tc.styles[it.fontName].fontFamily : '';
      curTextItems.push({ x: tx[4], y: tx[5] - fh, w: it.width || fh*it.str.length*0.5, h: fh, str: it.str,
        fontName: it.fontName, styleFamily });
    }
  } catch(e){}
  // 네이티브 이미지 영역 감지 (클릭해 추출·편집용) — 연산자 목록 + CTM 추적
  curImageRegions = [];
  try {
    const OPS = pdfjsLib.OPS, U = pdfjsLib.Util;
    const opl = await curPage.getOperatorList();
    let m = [1,0,0,1,0,0]; const st = [];
    for (let i=0; i<opl.fnArray.length; i++) {
      const fn = opl.fnArray[i], a = opl.argsArray[i];
      if (fn===OPS.save) st.push(m.slice());
      else if (fn===OPS.restore) m = st.pop() || [1,0,0,1,0,0];
      else if (fn===OPS.transform) m = U.transform(m, a);
      else if (fn===OPS.paintImageXObject || fn===OPS.paintJpegXObject || fn===OPS.paintImageMaskXObject || fn===OPS.paintInlineImage) {
        const cs = [[0,0],[1,0],[1,1],[0,1]].map(pt => U.applyTransform(U.applyTransform(pt, m), curVp1.transform));
        let mnx=1e9,mny=1e9,mxx=-1e9,mxy=-1e9;
        for (const [x,y] of cs) { mnx=Math.min(mnx,x);mny=Math.min(mny,y);mxx=Math.max(mxx,x);mxy=Math.max(mxy,y); }
        if (mxx-mnx>6 && mxy-mny>6) curImageRegions.push({ x:mnx, y:mny, w:mxx-mnx, h:mxy-mny });
      }
    }
  } catch(e){ curImageRegions = []; }
  updateZoomLabel();
  document.getElementById('pageLabel').textContent = `${curPos+1} / ${pages.length}  (원본 ${p.num||p.originalIdx+1}쪽)`;
  const _pri=document.getElementById('pageRotInput'); if(_pri) _pri.value=curPageAngle();
  applyPageRotDisplay();
  selectedIds.clear(); cropMode = false;
  renderObjects(); refreshThumbState(); renderProps();
}

function updateZoomLabel(){ document.getElementById('zoomLabel').textContent = Math.round(scale/baseScale*100) + '%'; }
function zoomBy(dir){ renderPage._userZoom = true; scale = Math.max(baseScale*0.25, Math.min(baseScale*4, scale*(dir>0?1.15:1/1.15))); renderPage(); }
function gotoPage(pos){ if(pos<0||pos>=pages.length) return; commitContentEditing(); curPos=pos; renderPage._userZoom=false; renderPage(); }

// ── 오브젝트 렌더 ────────────────────────────────────────────────────────────
function renderObjects() {
  overlay.querySelectorAll('.obj').forEach(e => e.remove());
  const frag = document.createDocumentFragment();
  for (const o of curModel()) frag.appendChild(buildObjEl(o));
  overlay.appendChild(frag);
  renderHandles();
}
function buildObjEl(o) {
  const el = document.createElement('div');
  el.className = 'obj obj-' + o.type;
  el.dataset.id = o.id;
  el.style.left = (o.x*scale)+'px'; el.style.top = (o.y*scale)+'px';
  el.style.width = (o.w*scale)+'px'; el.style.height = (o.h*scale)+'px';
  el.style.transform = `rotate(${o.rot||0}deg)`;
  if (selectedIds.has(o.id)) el.classList.add('selected');
  if (o.type === 'text' || o.type === 'redactText') {
    el.classList.add(o.type==='redactText'?'obj-redact':'obj-text');
    if (o.type==='redactText') el.style.background = o.bg || '#ffffff';
    el.style.color = o.color || '#000000';
    el.style.fontSize = (o.fontSize*scale)+'px';
    el.style.fontFamily = o.fontFamily || 'Malgun Gothic, sans-serif';
    el.style.fontWeight = o.bold ? '700' : '400';
    el.style.textAlign = o.align || 'left';
    el.textContent = o.text || '';
  } else if (o.type === 'rect') {
    el.classList.add('obj-rect');
    el.style.background = o.fill && o.fill!=='none' ? o.fill : 'transparent';
    el.style.border = (o.strokeW>0 && o.stroke) ? `${o.strokeW*scale}px solid ${o.stroke}` : 'none';
    if (o.isLine) renderLineCaps(el, o);
  } else if (o.type === 'mosaic') {
    el.classList.add('obj-mosaic');
    buildMosaicPreview(el, o);
  } else if (o.type === 'shape') {
    el.classList.add('obj-shape');
    const ns='http://www.w3.org/2000/svg';
    const svg=document.createElementNS(ns,'svg');
    svg.setAttribute('width', o.w*scale); svg.setAttribute('height', o.h*scale); svg.style.overflow='visible';
    const path=document.createElementNS(ns,'path');
    path.setAttribute('d', shapePathPx(o.shape, o.w*scale, o.h*scale));
    path.setAttribute('fill', (o.fill && o.fill!=='none') ? o.fill : 'none');
    path.setAttribute('stroke', o.stroke || 'none');
    path.setAttribute('stroke-width', (o.strokeW||0)*scale);
    path.setAttribute('stroke-linejoin','round');
    svg.appendChild(path); el.appendChild(svg);
  } else if (o.type === 'image') {
    el.classList.add('obj-image');
    const img = document.createElement('img');
    const cr = o.crop || {l:0,t:0,r:0,b:0};
    const vw = 1-cr.l-cr.r, vh = 1-cr.t-cr.b;
    img.src = o.dataUrl;
    img.style.width = (100/vw)+'%'; img.style.height = (100/vh)+'%';
    img.style.marginLeft = (-cr.l/vw*100)+'%'; img.style.marginTop = (-cr.t/vh*100)+'%';
    img.draggable = false;
    el.appendChild(img);
  }
  // 상호작용
  el.addEventListener('pointerdown', ev => onObjPointerDown(ev, o));
  el.addEventListener('dblclick', ev => { if (o.type==='text'||o.type==='redactText') startContentEditing(el, o, ev); });
  return el;
}

// ── 선 끝모양(캡) 렌더 ───────────────────────────────────────────────────────
// 선은 얇은 회전 사각형(.obj)이라, 로컬 좌우 끝(0·w)에 캡 모양을 자식으로 얹으면
// 부모 회전을 그대로 따라간다. 시작=좌측(-x 방향), 끝=우측(+x 방향).
function renderLineCaps(el, o) {
  const wpx = o.w*scale, hpx = o.h*scale;
  const sz = Math.max(10, hpx*3.5);
  if (o.startCap && o.startCap!=='none') el.appendChild(makeCap(o.startCap, o.fill||'#111', sz, 0,   hpx/2, -1));
  if (o.endCap   && o.endCap!=='none')   el.appendChild(makeCap(o.endCap,   o.fill||'#111', sz, wpx, hpx/2, +1));
}
function makeCap(type, color, sz, ex, ey, dir) {
  const ns='http://www.w3.org/2000/svg';
  const wrap=document.createElement('div');
  wrap.style.cssText='position:absolute;pointer-events:none;';
  const svg=document.createElementNS(ns,'svg');
  svg.setAttribute('viewBox','0 0 10 10'); svg.setAttribute('width',sz); svg.setAttribute('height',sz);
  svg.style.overflow='visible'; svg.style.display='block';
  let tipAtEnd=true;
  const mk=(t,at)=>{ const e=document.createElementNS(ns,t); for(const k in at) e.setAttribute(k,at[k]); return e; };
  if (type==='arrow')       svg.appendChild(mk('polyline',{points:'2,1 10,5 2,9', fill:'none', stroke:color, 'stroke-width':1.8, 'stroke-linecap':'round','stroke-linejoin':'round'}));
  else if (type==='filledArrow') svg.appendChild(mk('polygon',{points:'10,5 2,1.5 2,8.5', fill:color}));
  else if (type==='circle') { tipAtEnd=false; svg.appendChild(mk('circle',{cx:5,cy:5,r:4,fill:color})); }
  else if (type==='square') { tipAtEnd=false; svg.appendChild(mk('rect',{x:1.5,y:1.5,width:7,height:7,fill:color})); }
  wrap.appendChild(svg);
  if (tipAtEnd) { wrap.style.left=(ex-(dir>0?sz:0))+'px'; wrap.style.top=(ey-sz/2)+'px'; if(dir<0) wrap.style.transform='scaleX(-1)'; }
  else { wrap.style.left=(ex-sz/2)+'px'; wrap.style.top=(ey-sz/2)+'px'; }
  return wrap;
}

// ── 모자이크 미리보기 (편집기 화면) ──────────────────────────────────────────
// 페이지 캔버스의 해당 영역을 블록 단위로 축소→확대(픽셀화)해 보여준다.
function buildMosaicPreview(el, o) {
  const cvW=Math.max(1,Math.round(o.w*scale)), cvH=Math.max(1,Math.round(o.h*scale));
  const disp=document.createElement('canvas'); disp.width=cvW; disp.height=cvH;
  disp.style.width='100%'; disp.style.height='100%'; disp.style.display='block';
  try {
    const cell=Math.max(2,(o.cell||8))*scale;
    const bw=Math.max(1,Math.round(cvW/cell)), bh=Math.max(1,Math.round(cvH/cell));
    const tmp=document.createElement('canvas'); tmp.width=bw; tmp.height=bh;
    tmp.getContext('2d').drawImage(canvas, Math.round(o.x*scale), Math.round(o.y*scale), cvW, cvH, 0,0,bw,bh);
    const dctx=disp.getContext('2d'); dctx.imageSmoothingEnabled=false;
    dctx.drawImage(tmp, 0,0,bw,bh, 0,0,cvW,cvH);
  } catch(e){ const d=disp.getContext('2d'); d.fillStyle='#999'; d.fillRect(0,0,cvW,cvH); }
  el.appendChild(disp);
}

// ── 핸들(선택 시) ────────────────────────────────────────────────────────────
function renderHandles() {
  overlay.querySelectorAll('.handle').forEach(h => h.remove());
  if (selectedIds.size !== 1) return;
  const o = findObj([...selectedIds][0]); if (!o) return;
  const box = { left:o.x*scale, top:o.y*scale, w:o.w*scale, h:o.h*scale, rot:o.rot||0, cx:(o.x+o.w/2)*scale, cy:(o.y+o.h/2)*scale };
  const cls = cropMode ? 'handle crop' : 'handle';
  const pts = [['nw',0,0],['n',.5,0],['ne',1,0],['e',1,.5],['se',1,1],['s',.5,1],['sw',0,1],['w',0,.5]];
  for (const [name,fx,fy] of pts) {
    const h = document.createElement('div'); h.className = cls;
    positionHandle(h, box, box.left+fx*box.w, box.top+fy*box.h);
    h.style.cursor = cropMode ? 'crosshair' : 'nwse-resize';
    h.addEventListener('pointerdown', ev => cropMode ? onCropHandleDown(ev,o,name) : onResizeHandleDown(ev,o,name));
    overlay.appendChild(h);
  }
  if (!cropMode) {
    const h = document.createElement('div'); h.className = 'handle rot';
    positionHandle(h, box, box.left+box.w/2, box.top-26);
    h.addEventListener('pointerdown', ev => onRotHandleDown(ev,o));
    overlay.appendChild(h);
    // 모서리 바깥 회전존: 선택 오브젝트 모서리 살짝 바깥에 마우스를 대고 드래그하면 회전
    for (const [fx,fy] of [[0,0],[1,0],[1,1],[0,1]]) {
      const rz = document.createElement('div'); rz.className = 'handle rotzone';
      positionHandle(rz, box, box.left+fx*box.w+(fx?15:-15), box.top+fy*box.h+(fy?15:-15), 20);
      rz.addEventListener('pointerdown', ev => onRotHandleDown(ev,o));
      overlay.appendChild(rz);
    }
  }
}
// 회전 반영해 핸들을 실제 화면 위치로 배치
function positionHandle(h, box, px, py, size=10) {
  const a = (box.rot||0)*Math.PI/180, cos=Math.cos(a), sin=Math.sin(a);
  const dx=px-box.cx, dy=py-box.cy;
  const rx = box.cx + dx*cos - dy*sin, ry = box.cy + dx*sin + dy*cos;
  h.style.left = (rx-size/2)+'px'; h.style.top = (ry-size/2)+'px';
}

// ── 좌표 헬퍼 ────────────────────────────────────────────────────────────────
function stageXY(ev){ const r = stage.getBoundingClientRect(); return { x:(ev.clientX-r.left), y:(ev.clientY-r.top) }; } // device px
function toView(px){ return px/scale; }

// ── 툴 선택 ──────────────────────────────────────────────────────────────────
function setTool(t){ tool=t; ['select','text','edit','rect','line','shape','mosaic','region'].forEach(x=>{ const b=document.getElementById('tool-'+x); if(b) b.classList.toggle('active', x===t); }); cropMode=false; document.getElementById('btn-crop').classList.remove('active'); }
setTool('select');

// ── 스테이지 포인터 (생성 / 마퀴 선택) ──────────────────────────────────────
overlay.addEventListener('pointerdown', onStagePointerDown);
function onStagePointerDown(ev) {
  if (ev.target.classList.contains('handle')) return;
  if (ev.target.closest('.obj')) return;      // 오브젝트는 자기 핸들러
  commitContentEditing();
  const s = stageXY(ev);
  if (tool === 'text')  { createText(toView(s.x), toView(s.y)); setTool('select'); return; }
  if (tool === 'edit')  { editExistingAt(s.x, s.y, true); setTool('select'); return; }
  if (tool === 'rect' || tool === 'line' || tool === 'mosaic' || tool === 'shape') { startDrawShape(ev, tool); return; }
  if (tool === 'region') { startRegionEdit(ev); return; }
  // select 모드: 기존 글자 위 클릭 → 편집 오브젝트 선택 / 네이티브 그림 위 클릭 → 추출·편집
  if (tool === 'select' && !ev.shiftKey) {
    const vx = s.x/scale, vy = s.y/scale;
    const hit = curTextItems.find(t => vx>=t.x-1 && vx<=t.x+t.w+1 && vy>=t.y-1 && vy<=t.y+t.h+2);
    if (hit) { editExistingAt(s.x, s.y, false); return; }
    // 텍스트가 아니면: PDF 원본 이미지(그림·로고) 영역을 클릭했는지 확인 → 추출·편집
    const reg = curImageRegions.find(r => vx>=r.x-2 && vx<=r.x+r.w+2 && vy>=r.y-2 && vy<=r.y+r.h+2);
    if (reg) { extractRegion(reg.x*scale, reg.y*scale, reg.w*scale, reg.h*scale); return; }
  }
  // 빈 곳: 마퀴 선택
  startMarquee(ev);
}

function startMarquee(ev) {
  if (!ev.shiftKey) { selectedIds.clear(); renderObjects(); renderProps(); }
  const start = stageXY(ev);
  const mq = document.getElementById('marquee'); mq.style.display='block';
  const move = e => {
    const s = stageXY(e);
    const x=Math.min(start.x,s.x), y=Math.min(start.y,s.y), w=Math.abs(s.x-start.x), h=Math.abs(s.y-start.y);
    mq.style.left=x+'px'; mq.style.top=y+'px'; mq.style.width=w+'px'; mq.style.height=h+'px';
  };
  const up = e => {
    overlay.removeEventListener('pointermove',move); overlay.removeEventListener('pointerup',up);
    mq.style.display='none';
    const s = stageXY(e);
    const rx=Math.min(start.x,s.x)/scale, ry=Math.min(start.y,s.y)/scale, rw=Math.abs(s.x-start.x)/scale, rh=Math.abs(s.y-start.y)/scale;
    if (rw<4 && rh<4) { renderObjects(); renderProps(); return; }
    for (const o of curModel()) {
      if (o.x < rx+rw && o.x+o.w > rx && o.y < ry+rh && o.y+o.h > ry) selectWithGroup(o, true);
    }
    renderObjects(); renderProps();
  };
  overlay.addEventListener('pointermove',move); overlay.addEventListener('pointerup',up);
}

// ── 도형 갤러리 ───────────────────────────────────────────────────────────────
let currentShape = 'rect';
function _reg(w,h,n,rot0){ const cx=w/2,cy=h/2,rx=w/2,ry=h/2,p=[]; for(let i=0;i<n;i++){const a=rot0+i*2*Math.PI/n; p.push([cx+rx*Math.cos(a), cy+ry*Math.sin(a)]);} return p; }
function _star(w,h,n,ir){ const cx=w/2,cy=h/2,rx=w/2,ry=h/2,p=[]; for(let i=0;i<n*2;i++){const a=-Math.PI/2+i*Math.PI/n, r=(i%2===0)?1:ir; p.push([cx+rx*r*Math.cos(a), cy+ry*r*Math.sin(a)]);} return p; }
function _arc(cx,cy,rx,ry,a0,a1,n){ const p=[]; for(let i=0;i<=n;i++){const a=a0+(a1-a0)*i/n; p.push([cx+rx*Math.cos(a), cy+ry*Math.sin(a)]);} return p; }
function _rrectR(w,h,r){ r=Math.min(r, Math.min(w,h)/2); const s=5, p=[], cs=[[w-r,r,-Math.PI/2,0],[w-r,h-r,0,Math.PI/2],[r,h-r,Math.PI/2,Math.PI],[r,r,Math.PI,Math.PI*1.5]]; for(const[ccx,ccy,a0,a1] of cs){ for(let i=0;i<=s;i++){const a=a0+(a1-a0)*i/s; p.push([ccx+r*Math.cos(a),ccy+r*Math.sin(a)]);} } return p; }
function _rrect(w,h){ return _rrectR(w,h,Math.min(w,h)*0.2); }
function _frac(pts,w,h){ return pts.map(([x,y])=>[x*w,y*h]); }
function _heart(w,h){ const raw=[]; let mnx=1e9,mxx=-1e9,mny=1e9,mxy=-1e9; for(let i=0;i<=48;i++){ const t=Math.PI-i*2*Math.PI/48; const x=16*Math.pow(Math.sin(t),3); const y=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t)); raw.push([x,y]); mnx=Math.min(mnx,x);mxx=Math.max(mxx,x);mny=Math.min(mny,y);mxy=Math.max(mxy,y);} return raw.map(([x,y])=>[ (x-mnx)/(mxx-mnx)*w, (y-mny)/(mxy-mny)*h ]); }
const SHAPES = {
  // ── 사각형 ──
  rect:     { name:'직사각형',   verts:(w,h)=>[[0,0],[w,0],[w,h],[0,h]] },
  roundrect:{ name:'둥근사각형', verts:(w,h)=>_rrect(w,h) },
  round1:   { name:'한쪽둥근',   verts:(w,h)=>{const r=Math.min(w,h)*0.28; return [[0,0],[w-r,0],...(_arc(w-r,r,r,r,-Math.PI/2,0,5)),[w,h],[0,h]];} },
  snip:     { name:'모서리잘린', verts:(w,h)=>{const c=Math.min(w,h)*0.24; return [[c,0],[w,0],[w,h],[0,h],[0,c]];} },
  stadium:  { name:'타원형사각', verts:(w,h)=>_rrectR(w,h,Math.min(w,h)/2) },
  // ── 기본 도형 ──
  ellipse:  { name:'타원',       verts:(w,h)=>_reg(w,h,48,0) },
  triangle: { name:'삼각형',     verts:(w,h)=>[[w/2,0],[w,h],[0,h]] },
  rtri:     { name:'직각삼각형', verts:(w,h)=>[[0,0],[0,h],[w,h]] },
  invtri:   { name:'역삼각형',   verts:(w,h)=>[[0,0],[w,0],[w/2,h]] },
  diamond:  { name:'마름모',     verts:(w,h)=>[[w/2,0],[w,h/2],[w/2,h],[0,h/2]] },
  parallelo:{ name:'평행사변형', verts:(w,h)=>[[w*0.25,0],[w,0],[w*0.75,h],[0,h]] },
  trapezoid:{ name:'사다리꼴',   verts:(w,h)=>[[w*0.22,0],[w*0.78,0],[w,h],[0,h]] },
  pentagon: { name:'오각형',     verts:(w,h)=>_reg(w,h,5,-Math.PI/2) },
  hexagon:  { name:'육각형',     verts:(w,h)=>_reg(w,h,6,-Math.PI/2) },
  heptagon: { name:'칠각형',     verts:(w,h)=>_reg(w,h,7,-Math.PI/2) },
  octagon:  { name:'팔각형',     verts:(w,h)=>_reg(w,h,8,Math.PI/8) },
  decagon:  { name:'십각형',     verts:(w,h)=>_reg(w,h,10,-Math.PI/2) },
  dodecagon:{ name:'십이각형',   verts:(w,h)=>_reg(w,h,12,-Math.PI/2) },
  pie:      { name:'부채꼴',     verts:(w,h)=>[[w/2,h/2]].concat(_arc(w/2,h/2,w/2,h/2,-Math.PI*0.5,Math.PI,32)) },
  crescent: { name:'초승달',     verts:(w,h)=>_arc(w/2,h/2,w/2,h/2,Math.PI*0.5,Math.PI*1.5,26).concat(_arc(w*0.72,h/2,w*0.42,h*0.42,Math.PI*1.5,Math.PI*0.5,26)) },
  sun:      { name:'해',         verts:(w,h)=>_star(w,h,12,0.62) },
  cloud:    { name:'구름',       verts:(w,h)=>{const cx=w/2,cy=h/2,p=[]; for(let i=0;i<72;i++){const a=i/72*2*Math.PI; const r=0.80+0.20*Math.abs(Math.cos(9*a/2)); p.push([cx+(w/2)*r*Math.cos(a), cy+(h/2)*r*Math.sin(a)]);} return p;} },
  lightning:{ name:'번개',       verts:(w,h)=>_frac([[0.55,0],[0.18,0.52],[0.44,0.52],[0.30,1],[0.85,0.40],[0.55,0.40]],w,h) },
  heart:    { name:'하트',       verts:(w,h)=>_heart(w,h) },
  cross:    { name:'십자',       verts:(w,h)=>{const x0=w*0.33,x1=w*0.67,y0=h*0.33,y1=h*0.67; return [[x0,0],[x1,0],[x1,y0],[w,y0],[w,y1],[x1,y1],[x1,h],[x0,h],[x0,y1],[0,y1],[0,y0],[x0,y0]];} },
  // ── 블록 화살표 ──
  arrowR:   { name:'화살표(→)',  verts:(w,h)=>{const a=w*0.4,y0=h*0.28,y1=h*0.72; return [[0,y0],[w-a,y0],[w-a,0],[w,h/2],[w-a,h],[w-a,y1],[0,y1]];} },
  arrowL:   { name:'화살표(←)',  verts:(w,h)=>{const a=w*0.4,y0=h*0.28,y1=h*0.72; return [[w,y0],[a,y0],[a,0],[0,h/2],[a,h],[a,y1],[w,y1]];} },
  arrowU:   { name:'화살표(↑)',  verts:(w,h)=>{const a=h*0.4,x0=w*0.28,x1=w*0.72; return [[x0,h],[x0,a],[0,a],[w/2,0],[w,a],[x1,a],[x1,h]];} },
  arrowD:   { name:'화살표(↓)',  verts:(w,h)=>{const a=h*0.4,x0=w*0.28,x1=w*0.72; return [[x0,0],[x0,h-a],[0,h-a],[w/2,h],[w,h-a],[x1,h-a],[x1,0]];} },
  arrowLR:  { name:'화살표(↔)',  verts:(w,h)=>_frac([[0,0.5],[0.25,0],[0.25,0.28],[0.75,0.28],[0.75,0],[1,0.5],[0.75,1],[0.75,0.72],[0.25,0.72],[0.25,1]],w,h) },
  arrowUD:  { name:'화살표(↕)',  verts:(w,h)=>_frac([[0.5,0],[1,0.25],[0.72,0.25],[0.72,0.75],[1,0.75],[0.5,1],[0,0.75],[0.28,0.75],[0.28,0.25],[0,0.25]],w,h) },

function startDrawShape(ev, kind) {
  const start = stageXY(ev);
  pushUndo();
  let o;
  if (kind==='line') o = { id:nextId++, type:'rect', isLine:true, x:toView(start.x), y:toView(start.y), w:1, h:2, rot:0, fill:'#111111', stroke:null, strokeW:0, startCap:'none', endCap:'none' };
  else if (kind==='mosaic') o = { id:nextId++, type:'mosaic', x:toView(start.x), y:toView(start.y), w:1, h:1, rot:0, cell:8 };
  else if (kind==='shape') o = { id:nextId++, type:'shape', shape:currentShape, x:toView(start.x), y:toView(start.y), w:1, h:1, rot:0, fill:'none', stroke:'#1d1d1f', strokeW:1.5 };
  else o = { id:nextId++, type:'rect', x:toView(start.x), y:toView(start.y), w:1, h:1, rot:0, fill:'none', stroke:'#111111', strokeW:1 };
  curModel().push(o); markDirty();
  const move = e => {
    const s = stageXY(e);
    if (kind==='line') {
      // 시작점(클릭)은 고정, 끝점(마우스)으로 각도·길이 조절.
      // 선은 중심+회전(rot) 모델이라, 중심을 시작·끝의 중점에 두면 회전해도 시작점이 클릭에 고정된다.
      const sx=toView(start.x), sy=toView(start.y); let ex=toView(s.x), ey=toView(s.y);
      const len=Math.hypot(ex-sx, ey-sy); let ang=Math.atan2(ey-sy, ex-sx);
      // Shift: 45° 간격으로 각도 스냅 (시작점 고정, 길이 유지)
      if (e.shiftKey) { ang = Math.round(ang/(Math.PI/4))*(Math.PI/4); ex=sx+len*Math.cos(ang); ey=sy+len*Math.sin(ang); }
      o.w = Math.max(1,len); o.h = o.strokeW || o.h || 2; o.rot = ang*180/Math.PI;
      o.x = (sx+ex)/2 - o.w/2; o.y = (sy+ey)/2 - o.h/2;
    } else {
      o.x = Math.min(toView(start.x),toView(s.x)); o.y = Math.min(toView(start.y),toView(s.y));
      o.w = Math.abs(s.x-start.x)/scale; o.h = Math.abs(s.y-start.y)/scale;
    }
    renderObjects();
  };
  const up = () => { overlay.removeEventListener('pointermove',move); overlay.removeEventListener('pointerup',up);
    selectedIds = new Set([o.id]); setTool('select'); renderObjects(); renderProps(); };
  overlay.addEventListener('pointermove',move); overlay.addEventListener('pointerup',up);
}

// PDF 폰트명 → 시스템 폰트 매칭 (기존 텍스트 편집 시 실제 문서 폰트 적용)
function _fontNorm(s){ return String(s||'').toLowerCase().replace(/(regular|medium|bold|light|semibold|demibold|heavy|black|thin|italic|oblique|std|pro|mt|ps|kr|ko)/g,'').replace(/[^a-z0-9가-힣]/g,''); }
function matchSysFont(name){
  if(!name || !fontList.length) return null;
  const t=_fontNorm(name); if(!t) return null;
  let best=null;
  for(const f of fontList){ const fn=_fontNorm(f.name); if(!fn) continue;
    if(fn===t) return f;                                   // 정확 일치 우선
    if(!best && (fn.includes(t)||t.includes(fn))) best=f;  // 부분 일치
  }
  return best;
}
// 클릭한 기존 텍스트의 실제 폰트 해석: pdf.js commonObjs(원본 PS명) → styles.fontFamily 순
function resolveDocFont(item){
  let raw='', loaded='';
  try { const fo = curPage.commonObjs.get(item.fontName);
    raw = (fo && (fo.name || fo.loadedName)) || '';
    loaded = (fo && fo.loadedName) || '';           // pdf.js가 document.fonts에 등록한 실제 임베드 폰트 패밀리명
  } catch(e){}
  if(!raw) raw = item.styleFamily || '';
  // 서브셋 접두사(ABCDEF+) 제거, '-Bold' 등 스타일 접미 제거해 패밀리명만
  const clean = raw.replace(/^[A-Z]{6}\+/,'').replace(/[-,].*$/,'').trim();
  const m = matchSysFont(clean) || matchSysFont(raw);
  const cssName = clean || raw;
  // 화면 표시: 원본 임베드 폰트(loadedName) 최우선 → 문서 폰트명 → 폴백.
  // 이렇게 하면 클릭 즉시 맑은고딕으로 바뀌어 보이는 문제 없이 문서 폰트 그대로 편집된다.
  const fams = [];
  if (loaded) fams.push(`"${loaded}"`);
  if (cssName) fams.push(`"${cssName}"`);
  fams.push('Malgun Gothic','sans-serif');
  return {
    fontPath: m ? m.file : defaultFontPath(),   // 임베드용: 매칭 시스템폰트, 없으면 기본
    fontFamily: fams.join(', '),
    matched: !!m
  };
}
function editExistingAt(px, py, enterEdit) {
  // 클릭 지점의 텍스트 아이템 찾기 (view-units)

  for (const t of curTextItems) { if (vx>=t.x-1 && vx<=t.x+t.w+1 && vy>=t.y-1 && vy<=t.y+t.h+2) { hit=t; break; } }
  if (!hit) { setStatus('그 위치에서 편집할 기존 텍스트를 찾지 못했습니다.'); return; }
  pushUndo();

  const df = resolveDocFont(hit);   // 실제 문서 폰트로 (Malgun 강제 안 함)
  const o = { id:nextId++, type:'redactText', x:hit.x, y:hit.y-hit.h*0.1, w:Math.max(hit.w,12), h:hit.h*1.25, rot:0,
    text:hit.str, fontSize:hit.h, color:'#111111', bg, fontFamily:df.fontFamily,
    fontPath:df.fontPath, bold:false, align:'left' };
  curModel().push(o); markDirty(); selectedIds=new Set([o.id]); renderObjects(); renderProps();

  if (enterEdit) { const el = overlay.querySelector(`.obj[data-id="${o.id}"]`); if (el) startContentEditing(el, o); }
  else setStatus('기존 텍스트를 선택했습니다 — 더블클릭하면 편집, 오른쪽에서 글꼴 변경');
}
function sampleBg(bbox) {
  try {
    // 텍스트 위/아래 여백에서 배경색 추정 (가장 밝은 픽셀)
    const pts=[[bbox.x*scale-3, (bbox.y-2)*scale],[bbox.x*scale, (bbox.y+bbox.h+3)*scale],[(bbox.x+bbox.w)*scale, (bbox.y-2)*scale]];
    let best=[255,255,255], bestL=-1;
    for (const [x,y] of pts) {
      const cx=Math.max(0,Math.min(canvas.width-1,x|0)), cy=Math.max(0,Math.min(canvas.height-1,y|0));
      const d=bgCanvasCtx.getImageData(cx,cy,1,1).data; const l=d[0]+d[1]+d[2];
      if (l>bestL){ bestL=l; best=[d[0],d[1],d[2]]; }
    }
    return '#'+best.map(v=>v.toString(16).padStart(2,'0')).join('');
  } catch(e){ return '#ffffff'; }
}
// 사각 영역 주변에서 배경색 추정 (원본 요소를 가릴 색)
function sampleBgRect(px,py,pw,ph) {
  try {
    const pts=[[px-4,py+ph/2],[px+pw+4,py+ph/2],[px+pw/2,py-4],[px+pw/2,py+ph+4]];
    let best=[255,255,255], bl=-1;
    for (const [x,y] of pts) {
      const cx=Math.max(0,Math.min(canvas.width-1,x|0)), cy=Math.max(0,Math.min(canvas.height-1,y|0));
      const d=bgCanvasCtx.getImageData(cx,cy,1,1).data; const l=d[0]+d[1]+d[2];
      if (l>bl){ bl=l; best=[d[0],d[1],d[2]]; }
    }
    return '#'+best.map(v=>v.toString(16).padStart(2,'0')).join('');
  } catch(e){ return '#ffffff'; }
}
// 원본(네이티브) 요소 영역을 편집 가능한 이미지로 추출 + 원본은 배경색으로 가림
// px,py,pw,ph = 스테이지 상의 device px (canvas와 동일 스케일)
function extractRegion(px,py,pw,ph) {
  pushUndo();
  const vx=px/scale, vy=py/scale, vw=pw/scale, vh=ph/scale;
  let dataUrl=null;
  try {
    const sx=Math.round(px), sy=Math.round(py), sw=Math.max(1,Math.round(pw)), sh=Math.max(1,Math.round(ph));
    const tmp=document.createElement('canvas'); tmp.width=sw; tmp.height=sh;
    tmp.getContext('2d').drawImage(canvas, sx,sy,sw,sh, 0,0,sw,sh);
    dataUrl=tmp.toDataURL('image/png');
  } catch(e){ console.warn('영역 추출 실패', e); }
  // 배경색으로 원본 가리기 (이 사각형을 두면 원본 요소가 사라진 것처럼 보임)
  const bg=sampleBgRect(px,py,pw,ph);
  const cover={ id:nextId++, type:'rect', x:vx,y:vy,w:vw,h:vh, rot:0, fill:bg, stroke:null, strokeW:0 };
  curModel().push(cover);
  let sel=cover.id;
  if (dataUrl) {
    const img={ id:nextId++, type:'image', x:vx,y:vy,w:vw,h:vh, rot:0, dataUrl, natW:Math.round(pw), natH:Math.round(ph), crop:{l:0,t:0,r:0,b:0} };
    curModel().push(img); sel=img.id;
  }
  markDirty(); selectedIds=new Set([sel]); renderObjects(); renderProps();
  setStatus('원본 요소를 편집 가능한 이미지로 추출했습니다 — 이동·크기조절·삭제 가능(원본은 가려짐). 원본 유지하려면 실행취소');
}

function addImage(dataUrl) {

function defaultFontPath() {
  const f = fontList.find(x => /malgun\.ttf$/i.test(x.file)) || fontList.find(x=>/(gulim|batang|malgun|dotum|nanum)/i.test(x.file));
  return f ? f.file : (fontList[0] && fontList[0].file) || null;
}

// ── 인라인 텍스트 편집 ───────────────────────────────────────────────────────
let _editingEl = null, _editingObj = null;
function startContentEditing(el, o, ev) {
  commitContentEditing();
  _editingEl = el; _editingObj = o;
  el.setAttribute('contenteditable','true'); el.style.cursor='text';
  el.focus();
  // 커서 전체 선택
  const range=document.createRange(); range.selectNodeContents(el);
  const sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
  el.addEventListener('blur', commitContentEditing, { once:true });
  if (ev) ev.stopPropagation();
}
function commitContentEditing() {
  if (!_editingEl) return;
  const el=_editingEl, o=_editingObj; _editingEl=null; _editingObj=null;
  const txt = el.innerText.replace(/\n$/,'');
  el.removeAttribute('contenteditable'); el.style.cursor='move';
  if (o && o.text !== txt) { pushUndo(); o.text = txt; markDirty(); }
  renderProps();
}

// ── 오브젝트 이동 ────────────────────────────────────────────────────────────
function onObjPointerDown(ev, o) {
  if (_editingObj === o) return;      // 편집 중이면 통과
  ev.stopPropagation();
  commitContentEditing();
  if (ev.shiftKey) { selectWithGroup(o, !selectedIds.has(o.id) ? true : 'toggle'); renderObjects(); renderProps(); return; }
  if (!selectedIds.has(o.id)) { selectedIds.clear(); selectWithGroup(o, true); renderObjects(); renderProps(); }
  // 드래그 이동
  const start = stageXY(ev); let moved=false; let undoPushed=false;
  const ids = [...selectedIds];
  const startPos = ids.map(id => { const t=findObj(id); return { id, x:t.x, y:t.y }; });
  const move = e => {
    const s = stageXY(e); const dx=(s.x-start.x)/scale, dy=(s.y-start.y)/scale;
    if (!moved && (Math.abs(dx)>0.5||Math.abs(dy)>0.5)) { moved=true; if(!undoPushed){pushUndo();undoPushed=true;} }
    if (!moved) return;
    startPos.forEach(sp => { const t=findObj(sp.id); if(t){ t.x=sp.x+dx; t.y=sp.y+dy; } });
    renderObjects();
  };
  const up = () => { window.removeEventListener('pointermove',move); window.removeEventListener('pointerup',up);
    if (moved) { markDirty(); } renderProps(); };
  window.addEventListener('pointermove',move); window.addEventListener('pointerup',up);
}

// ── 리사이즈 ─────────────────────────────────────────────────────────────────
function onResizeHandleDown(ev, o, name) {
  ev.stopPropagation(); ev.preventDefault();
  const start = stageXY(ev); const o0={x:o.x,y:o.y,w:o.w,h:o.h}; let undoPushed=false;
  const a=(o.rot||0)*Math.PI/180, cos=Math.cos(a), sin=Math.sin(a);
  const move = e => {
    const s = stageXY(e); let dx=(s.x-start.x)/scale, dy=(s.y-start.y)/scale;
    // 화면 델타 → 오브젝트 로컬축 투영
    const lx = dx*cos + dy*sin, ly = -dx*sin + dy*cos;
    if(!undoPushed){pushUndo();undoPushed=true;}
    let {x,y,w,h}=o0;
    if (name.includes('e')) w=o0.w+lx;
    if (name.includes('s')) h=o0.h+ly;
    if (name.includes('w')) { w=o0.w-lx; }
    if (name.includes('n')) { h=o0.h-ly; }
    // Shift: 원본 가로세로 비율 고정
    if (e.shiftKey && o0.w>0 && o0.h>0) {
      const ratio = o0.w/o0.h;
      if (name.length===2) {   // 모서리: 변화량이 큰 축 기준
        if (Math.abs(w-o0.w) >= Math.abs(h-o0.h)*ratio) h = w/ratio; else w = h*ratio;
      }
      else if (name==='e'||name==='w') h = w/ratio;
      else w = h*ratio;
    }
    w=Math.max(6,w); h=Math.max(6,h);
    // 서쪽/북쪽 핸들은 반대편 고정 위해 중심 이동 보정(로컬축)
    let mx=0,my=0;
    if (name.includes('w')) mx = o0.w - w;
    if (name.includes('n')) my = o0.h - h;
    o.x = o0.x + (mx*cos - my*sin); o.y = o0.y + (mx*sin + my*cos);
    o.w=w; o.h=h;
    if (o.type==='text'||o.type==='redactText') { /* 폰트크기 유지 */ }
    renderObjects();
  };
  const up = () => { window.removeEventListener('pointermove',move); window.removeEventListener('pointerup',up); markDirty(); renderProps(); };
  window.addEventListener('pointermove',move); window.addEventListener('pointerup',up);
}

// ── 회전 핸들 ────────────────────────────────────────────────────────────────
function onRotHandleDown(ev, o) {
  ev.stopPropagation(); ev.preventDefault();
  const cx=(o.x+o.w/2)*scale, cy=(o.y+o.h/2)*scale; let undoPushed=false;
  // 델타 방식: 잡은 지점 기준 상대 회전 — 상단 핸들뿐 아니라 모서리 회전존에서도 점프 없이 동작
  const s0=stageXY(ev), a0=Math.atan2(s0.y-cy, s0.x-cx)*180/Math.PI, r0=o.rot||0;
  const move = e => {
    const s = stageXY(e); const ang=Math.atan2(s.y-cy, s.x-cx)*180/Math.PI;
    if(!undoPushed){pushUndo();undoPushed=true;}
    let nr = r0 + (ang - a0);
    nr = e.shiftKey ? Math.round(nr/45)*45 : Math.round(nr*10)/10;   // Shift=45° 스냅, 기본 0.1°
    nr = ((nr+180)%360+360)%360-180;   // -180~180 정규화
    o.rot = nr;
    renderObjects(); renderProps();
  };
  const up = () => { window.removeEventListener('pointermove',move); window.removeEventListener('pointerup',up); markDirty(); };
  window.addEventListener('pointermove',move); window.addEventListener('pointerup',up);
}

// ── 자르기(crop) ─────────────────────────────────────────────────────────────
function toggleCrop() {
  if (selectedIds.size!==1) { setStatus('자를 오브젝트 하나를 선택하세요.'); return; }
  const o=findObj([...selectedIds][0]);
  if (o.type!=='image') { setStatus('자르기는 이미지에만 적용됩니다.'); return; }
  cropMode=!cropMode; document.getElementById('btn-crop').classList.toggle('active',cropMode); renderHandles();
}
function onCropHandleDown(ev, o, name) {
  ev.stopPropagation(); ev.preventDefault();
  const start=stageXY(ev); const c0=Object.assign({l:0,t:0,r:0,b:0}, o.crop||{}); const o0={x:o.x,y:o.y,w:o.w,h:o.h};
  const fullW = o0.w/Math.max(0.01,1-c0.l-c0.r), fullH = o0.h/Math.max(0.01,1-c0.t-c0.b);
  const cl=(v)=>Math.max(0,Math.min(0.95,v)); let undoPushed=false;
  const move=e=>{
    const s=stageXY(e); const dxv=(s.x-start.x)/scale, dyv=(s.y-start.y)/scale;
    if(!undoPushed){pushUndo();undoPushed=true;}
    const cr={...c0}; let x=o0.x,y=o0.y,w=o0.w,h=o0.h;
    // 가장자리를 안쪽으로 끌면 crop 비율↑·박스 축소, 바깥으로 끌면 crop 해제
    if (name.includes('e')) { w=o0.w+dxv; cr.r=cl(c0.r - dxv/fullW); }
    if (name.includes('w')) { w=o0.w-dxv; x=o0.x+dxv; cr.l=cl(c0.l + dxv/fullW); }
    if (name.includes('s')) { h=o0.h+dyv; cr.b=cl(c0.b - dyv/fullH); }
    if (name.includes('n')) { h=o0.h-dyv; y=o0.y+dyv; cr.t=cl(c0.t + dyv/fullH); }
    o.crop=cr; o.x=x; o.y=y; o.w=Math.max(8,w); o.h=Math.max(8,h);
    renderObjects(); renderHandles();
  };
  const up=()=>{ window.removeEventListener('pointermove',move); window.removeEventListener('pointerup',up); markDirty(); };
  window.addEventListener('pointermove',move); window.addEventListener('pointerup',up);
}

// ── 선택/그룹 ────────────────────────────────────────────────────────────────
function findObj(id){ return curModel().find(o=>o.id===id); }
function selectWithGroup(o, mode) {
  const members = o.groupId ? curModel().filter(x=>x.groupId===o.groupId) : [o];
  for (const m of members) {
    if (mode==='toggle') { selectedIds.has(m.id)?selectedIds.delete(m.id):selectedIds.add(m.id); }
    else selectedIds.add(m.id);
  }
}
function groupSelection() {
  if (selectedIds.size<2) { setStatus('2개 이상 선택 후 그룹하세요.'); return; }
  pushUndo(); const gid='g'+(nextId++);
  selectedIds.forEach(id=>{ const o=findObj(id); if(o) o.groupId=gid; });
  markDirty(); setStatus('그룹으로 묶었습니다.'); renderObjects(); renderProps();
}
function ungroupSelection() {
  if (!selectedIds.size) return; pushUndo();
  selectedIds.forEach(id=>{ const o=findObj(id); if(o) delete o.groupId; });
  markDirty(); setStatus('그룹을 해제했습니다.'); renderObjects(); renderProps();
}

// ── 정밀 회전 (선택/그룹 전체를 공통 중심으로 회전) ───────────────────────────
function rotateSelection(deltaDeg, exact) {
  if (!selectedIds.size) { setStatus('회전할 대상을 선택하세요.'); return; }
  const step = parseFloat(document.getElementById('rotStep').value)||0.1;
  const d = exact ? deltaDeg : (deltaDeg>0 ? step : -step);   // exact=true면 deltaDeg 그대로(예: Shift+[ ] 1°)
  pushUndo();
  const ids=[...selectedIds]; const objs=ids.map(findObj).filter(Boolean);
  if (objs.length===1) { const o=objs[0]; o.rot=Math.round(((o.rot||0)+d)*10)/10; }
  else {
    // 공통 바운딩 중심
    let minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
    objs.forEach(o=>{ minx=Math.min(minx,o.x); miny=Math.min(miny,o.y); maxx=Math.max(maxx,o.x+o.w); maxy=Math.max(maxy,o.y+o.h); });
    const gcx=(minx+maxx)/2, gcy=(miny+maxy)/2; const a=d*Math.PI/180, cos=Math.cos(a), sin=Math.sin(a);
    objs.forEach(o=>{ const ocx=o.x+o.w/2, ocy=o.y+o.h/2; const dx=ocx-gcx, dy=ocy-gcy;
      const nx=gcx+dx*cos-dy*sin, ny=gcy+dx*sin+dy*cos;
      o.x += (nx-ocx); o.y += (ny-ocy); o.rot=Math.round(((o.rot||0)+d)*10)/10; });
  }
  markDirty(); renderObjects(); renderProps();
}

// ── 삭제 ─────────────────────────────────────────────────────────────────────
function deleteSelection() {
  if (!selectedIds.size) return; pushUndo();
  const m = curModel().filter(o=>!selectedIds.has(o.id));
  models.set(pages[curPos].originalIdx, m); selectedIds.clear(); markDirty(); renderObjects(); renderProps();
}

// ── 속성 패널 ────────────────────────────────────────────────────────────────
function renderProps() {
  if (selectedIds.size===0) { propsEl.innerHTML = '<div class="hint"><b>PDF의 기존 글자를 클릭</b>하면 바로 수정됩니다.<br>새 텍스트=<b>T</b>, 이미지=<b>I</b>, 도형=<b>R</b>.</div>'; return; }
  if (selectedIds.size>1) {
    propsEl.innerHTML = `<h3>${selectedIds.size}개 선택됨</h3>
      <div class="mini"><button onclick="groupSelection()">그룹 (Ctrl+G)</button><button onclick="ungroupSelection()">해제</button></div>
      <div class="sep"></div><div class="row"><label>정밀회전</label>
      <button onclick="rotateSelection(-0.1)">−</button><button onclick="rotateSelection(0.1)">＋</button></div>
      <div class="hint">[ / ] 키로 0.1° 회전 · Shift+[ / ] 1° 회전</div>`;
    return;
  }

  let html = `<h3>${typeName(o)}</h3>`;
  html += `<div class="row"><label>X</label><input type="number" value="${Math.round(o.x)}" oninput="setProp('x',this.value)"></div>`;
  html += `<div class="row"><label>Y</label><input type="number" value="${Math.round(o.y)}" oninput="setProp('y',this.value)"></div>`;
  html += `<div class="row"><label>가로</label><input type="number" value="${Math.round(o.w)}" oninput="setProp('w',this.value)"></div>`;
  html += `<div class="row"><label>세로</label><input type="number" value="${Math.round(o.h)}" oninput="setProp('h',this.value)"></div>`;
  html += `<div class="row"><label>회전°</label><input type="number" step="0.1" value="${Math.round((o.rot||0)*10)/10}" oninput="setProp('rot',this.value)"></div>`;
  if (o.type==='text'||o.type==='redactText') {
    html += `<div class="sep"></div>`;
    html += `<div class="row"><label>글꼴크기</label><input type="number" value="${Math.round(o.fontSize)}" oninput="setProp('fontSize',this.value)"></div>`;
    html += `<div class="row"><label>글자색</label><input type="color" value="${o.color||'#111111'}" oninput="setProp('color',this.value)"></div>`;
    if (o.type==='redactText') html += `<div class="row"><label>가림색</label><input type="color" value="${o.bg||'#ffffff'}" oninput="setProp('bg',this.value)"></div>`;
    html += `<div class="row"><label>굵게</label><input type="checkbox" ${o.bold?'checked':''} onchange="setProp('bold',this.checked)"></div>`;
    html += `<div class="row"><label>정렬</label><select onchange="setProp('align',this.value)">
      <option value="left" ${o.align==='left'?'selected':''}>왼쪽</option>
      <option value="center" ${o.align==='center'?'selected':''}>가운데</option>
      <option value="right" ${o.align==='right'?'selected':''}>오른쪽</option></select></div>`;
    html += `<div class="row"><label>글꼴</label><select onchange="setFont(this.value)">${fontOptions(o.fontPath)}</select></div>`;
  }
  if (o.type==='rect' && !o.isLine) {
    html += `<div class="sep"></div>`;
    html += `<div class="row"><label>채움</label><input type="color" value="${o.fill&&o.fill!=='none'?o.fill:'#ffffff'}" oninput="setProp('fill',this.value)"> <button onclick="setProp('fill','none')">없음</button></div>`;
    html += `<div class="row"><label>선색</label><input type="color" value="${o.stroke||'#111111'}" oninput="setProp('stroke',this.value)"></div>`;
    html += `<div class="row"><label>선두께</label><input type="number" value="${o.strokeW||0}" oninput="setProp('strokeW',this.value)"></div>`;
  }
  if (o.type==='rect' && o.isLine) {
    html += `<div class="sep"></div><div class="row"><label>선색</label><input type="color" value="${o.fill||'#111111'}" oninput="setProp('fill',this.value)"></div>`;
    html += `<div class="row"><label>두께</label><input type="number" value="${Math.round(o.h)}" oninput="setProp('h',this.value)"></div>`;
    html += `<div class="row"><label>시작모양</label><select onchange="setProp('startCap',this.value)">${capOptions(o.startCap)}</select></div>`;
    html += `<div class="row"><label>끝모양</label><select onchange="setProp('endCap',this.value)">${capOptions(o.endCap)}</select></div>`;
  }
  if (o.type==='mosaic') {
    html += `<div class="sep"></div><div class="row"><label>블록크기</label><input type="number" value="${Math.round(o.cell||8)}" min="2" oninput="setProp('cell',this.value)"></div>`;
    html += `<div class="hint">숫자가 클수록 더 거칠게(굵은 모자이크) 가립니다. 저장 시 원본 픽셀을 실제로 픽셀화해 덮으므로 원문 복원이 불가합니다.</div>`;
  }
  if (o.type==='shape') {
    html += `<div class="sep"></div>`;
    html += `<div class="row"><label>도형</label><select onchange="setShape(this.value)">${shapeOptions(o.shape)}</select></div>`;
    html += `<div class="row"><label>채움</label><input type="color" value="${o.fill&&o.fill!=='none'?o.fill:'#cccccc'}" oninput="setProp('fill',this.value)"> <button onclick="setProp('fill','none')">없음</button></div>`;
    html += `<div class="row"><label>선색</label><input type="color" value="${o.stroke||'#1d1d1f'}" oninput="setProp('stroke',this.value)"></div>`;
    html += `<div class="row"><label>선두께</label><input type="number" value="${o.strokeW||0}" oninput="setProp('strokeW',this.value)"></div>`;
  }
  if (o.type==='image') {
    html += `<div class="sep"></div><div class="mini"><button onclick="toggleCrop()">자르기 (C)</button></div>`;
    const cr=o.crop||{l:0,t:0,r:0,b:0};
    html += `<div class="hint">잘림: L${Math.round(cr.l*100)} T${Math.round(cr.t*100)} R${Math.round(cr.r*100)} B${Math.round(cr.b*100)}</div>`;
  }
  html += `<div class="sep"></div><div class="mini"><button onclick="deleteSelection()">삭제 (Del)</button></div>`;
  propsEl.innerHTML = html;
}
function typeName(o){ return o.type==='text'?'삽입 텍스트':o.type==='redactText'?'기존 텍스트 편집':o.type==='image'?'이미지':o.type==='mosaic'?'모자이크':o.type==='shape'?('도형 · '+((SHAPES[o.shape]||{}).name||'')):o.isLine?'선':'사각형'; }
function capOptions(cur){
  const opts=[['none','없음'],['arrow','화살표(선)'],['filledArrow','화살표(채움)'],['circle','원'],['square','사각']];
  return opts.map(([v,l])=>`<option value="${v}" ${v===(cur||'none')?'selected':''}>${l}</option>`).join('');
}
function fontOptions(cur){
  const common = fontList.filter(f=>/(malgun|gulim|batang|dotum|nanum|gothic|arial|times)/i.test(f.file)).slice(0,20);
  let list = common.length?common:fontList.slice(0,20);
  // 현재(문서에서 감지한) 폰트가 목록에 없으면 맨 앞에 넣어 선택 상태로 보이게 한다
  if (cur && !list.some(f=>f.file===cur)) {
    const f = fontList.find(x=>x.file===cur);
    list = [ f || { file:cur, name:'문서 폰트' }, ...list ];
  }
  return list.map(f=>`<option value="${f.file}" ${f.file===cur?'selected':''}>${f.name}</option>`).join('');
}
function setProp(k,v){ const o=findObj([...selectedIds][0]); if(!o) return;
  if (['x','y','w','h','rot','fontSize','strokeW','cell'].includes(k)) v=parseFloat(v)||0;
  o[k]=v; markDirty(); renderObjects(); if(k==='rot'||k==='w'||k==='h') renderHandles(); }
function setFont(path){ const o=findObj([...selectedIds][0]); if(!o) return; o.fontPath=path;
  const f=fontList.find(x=>x.file===path); o.fontFamily = f?`"${f.name}", Malgun Gothic, sans-serif`:'Malgun Gothic, sans-serif';
  markDirty(); renderObjects(); }

// ── 변경/undo ────────────────────────────────────────────────────────────────
function markDirty(){ dirtyPages.add(pages[curPos].originalIdx); refreshThumbState(); }
function snapshot(){ return JSON.stringify(curModel()); }
function pushUndo(){ undoStack.push({ idx:pages[curPos].originalIdx, data:snapshot() }); if(undoStack.length>200) undoStack.shift(); redoStack.length=0; }
function undo(){ const s=undoStack.pop(); if(!s) return; if(s.idx!==pages[curPos].originalIdx){ /* 다른 페이지 */ }
  redoStack.push({ idx:s.idx, data:JSON.stringify(models.get(s.idx)||[]) });
  models.set(s.idx, JSON.parse(s.data).map(o=>({...o}))); dirtyPages.add(s.idx);
  if(s.idx===pages[curPos].originalIdx){ selectedIds.clear(); renderObjects(); renderProps(); } refreshThumbState(); }
function redo(){ const s=redoStack.pop(); if(!s) return;
  undoStack.push({ idx:s.idx, data:JSON.stringify(models.get(s.idx)||[]) });
  models.set(s.idx, JSON.parse(s.data).map(o=>({...o}))); dirtyPages.add(s.idx);
  if(s.idx===pages[curPos].originalIdx){ selectedIds.clear(); renderObjects(); renderProps(); } refreshThumbState(); }

// ── 단축키 ───────────────────────────────────────────────────────────────────
window.addEventListener('keydown', e => {
  if (_editingEl) {   // 텍스트 편집 중엔 Esc/Ctrl+Enter만
    if (e.key==='Escape'){ commitContentEditing(); e.preventDefault(); }
    return;
  }
  const inField = ['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName);
  if (e.ctrlKey || e.metaKey) {
    if (e.key==='s'||e.key==='S'){ e.preventDefault(); saveAndClose(); }
    else if (e.key==='z'||e.key==='Z'){ e.preventDefault(); e.shiftKey?redo():undo(); }
    else if (e.key==='y'||e.key==='Y'){ e.preventDefault(); redo(); }
    else if (e.key==='g'||e.key==='G'){ e.preventDefault(); e.shiftKey?ungroupSelection():groupSelection(); }
    return;
  }
  if (inField) return;
  switch (e.key) {
    case 'v': case 'V': setTool('select'); break;
    case 't': case 'T': setTool('text'); break;
    case 'e': case 'E': setTool('edit'); break;
    case 'i': case 'I': pickImage(); break;
    case 'l': case 'L': setTool('line'); break;
    case 'r': case 'R': case 's': case 'S': toggleShapePalette(); break;
    case 'm': case 'M': setTool('mosaic'); break;
    case 'g': case 'G': setTool('region'); break;
    case 'c': case 'C': toggleCrop(); break;
    case '[': e.preventDefault(); rotateSelection(-0.1); break;
    case ']': e.preventDefault(); rotateSelection(+0.1); break;
    case '{': e.preventDefault(); rotateSelection(-1, true); break;   // Shift+[ = 1°씩
    case '}': e.preventDefault(); rotateSelection(+1, true); break;   // Shift+] = 1°씩
    case 'Delete': case 'Backspace': e.preventDefault(); deleteSelection(); break;
    case 'Escape': if (cropMode){ cropMode=false; document.getElementById('btn-crop').classList.remove('active'); renderHandles(); } else cancelClose(); break;
    case 'PageDown': gotoPage(curPos+1); break;
    case 'PageUp': gotoPage(curPos-1); break;
  }
});

// ── 저장 (모든 편집 페이지 → 단일페이지 PDF로 굽기) ──────────────────────────
async function saveAndClose() {
  commitContentEditing();
  try {
    showBusy(true,'편집 내용 저장 중…');
    const edits = {}; const removed = [];
    // 편집이 있는 모든 페이지 (기존 모델 + 페이지회전 포함) 대상
    const allIdx = new Set([...models.keys(), ...pageAngles.keys(), ...(Object.keys(PAYLOAD.models||{}).map(Number))]);
    for (const idx of allIdx) {
      const model = (models.get(idx)||[]).filter(o=>o && (o.type!=='text' && o.type!=='redactText' ? true : (o.text||'').length>=0));
      const ang = pageAngles.get(idx) || 0;
      if (!model.length && !ang) { removed.push(idx); continue; }   // 오브젝트도 회전도 없으면 편집 제거
      const bytes = await bakePage(idx, model);
      const bytesPath = window.electronAPI.writeTempFile(bytes, 'pdf');
      // 재편집 복원용: 페이지회전을 모델에 마커로 저장
      const savedModel = model.map(stripForModel);
      if (ang) savedModel.push({ type:'_pageAngle', deg:ang });
      edits[idx] = { model: savedModel, bytesPath };
    }
    window.electronAPI.sendEditorResult({ edits, removed });
  } catch (e) {
    console.error(e); showBusy(false); setStatus('저장 오류: ' + (e.message||e), 6000);
  }
}
function stripForModel(o){ const c={...o}; return c; }   // 이미지 dataUrl 포함(재편집용)

async function cancelClose() {
  if (dirtyPages.size>0) {
    if (!confirm('저장하지 않은 편집 내용이 있습니다. 저장 없이 닫을까요?')) return;
  }
  window.electronAPI.closeEditorWindow();
}

// ── pdf-lib 단일페이지 굽기 ──────────────────────────────────────────────────
let _bakeSrc = null;   // 원본 문서(재사용)
const _fontCache = new Map();
async function loadPdfLibFont(pdfDoc, fontPath, needEmbed) {
  if (!needEmbed || !fontPath) return await pdfDoc.embedFont(StandardFonts.Helvetica);
  try {
    if (!_fontCache.has(fontPath)) _fontCache.set(fontPath, new Uint8Array(window.electronAPI.readFile(fontPath)));
    pdfDoc.registerFontkit(fontkit);
    return await pdfDoc.embedFont(_fontCache.get(fontPath), { subset:true });
  } catch(e){ console.warn('폰트 임베드 실패, Helvetica로 대체', e); return await pdfDoc.embedFont(StandardFonts.Helvetica); }
}
function hexToRgb(hex){ hex=(hex||'#000000').replace('#',''); if(hex.length===3) hex=hex.split('').map(c=>c+c).join('');
  const n=parseInt(hex,16); return rgb(((n>>16)&255)/255, ((n>>8)&255)/255, (n&255)/255); }
const isAscii = s => /^[\x00-\x7F]*$/.test(s||'');

async function bakePage(originalIdx, model) {
  if (!_bakeSrc) _bakeSrc = await PDFDocument.load(origBytes.slice(0));
  const angle = pageAngles.get(originalIdx) || 0;   // 페이지 전체 미세회전(스캔 기울기 보정)
  const pjs = await pdfjsDoc.getPage(originalIdx+1);
  const vp = pjs.getViewport({ scale:1, rotation:0 });
  const convBase = (vx,vy) => { const p = vp.convertToPdfPoint(vx,vy); return { x:p[0], y:p[1] }; };
  const out = await PDFDocument.create();
  let pg, conv;
  if (!angle) {
    [pg] = await out.copyPages(_bakeSrc, [originalIdx]); out.addPage(pg); conv = convBase;
  } else {
    // 원본 페이지를 embedPage로 넣고 페이지 중심 기준으로 회전해 새 페이지에 그린다.
    const srcPage = _bakeSrc.getPage(originalIdx);
    const sz = srcPage.getSize(); const W=sz.width, Hh=sz.height;
    pg = out.addPage([W, Hh]);
    const emb = await out.embedPage(srcPage);
    // 화면 시계방향 angle → pdf 회전 -angle. 좌하단을 중심기준 -angle 회전 위치로 두고 그 점 기준 회전.
    const aR = -angle*Math.PI/180, cs=Math.cos(aR), sn=Math.sin(aR);
    const llx = W/2 + (-W/2)*cs - (-Hh/2)*sn, lly = Hh/2 + (-W/2)*sn + (-Hh/2)*cs;
    pg.drawPage(emb, { x:llx, y:lly, width:W, height:Hh, rotate: degrees(-angle) });
    // 오버레이 좌표변환: 뷰좌표를 페이지중심 기준 시계방향 angle 회전한 뒤 convBase
    const va=angle*Math.PI/180, vcs=Math.cos(va), vsn=Math.sin(va), pcx=vp.width/2, pcy=vp.height/2;
    conv = (vx,vy)=>{ const rx=pcx+(vx-pcx)*vcs-(vy-pcy)*vsn, ry=pcy+(vx-pcx)*vsn+(vy-pcy)*vcs; return convBase(rx,ry); };
  }
  _mosaicPjs = pjs; _mosaicRaster = null;   // 이 페이지의 모자이크용 래스터(지연 렌더·재사용)
  // 오브젝트를 그리기 순서대로
  for (const o of model) {
    try { await drawObj(out, pg, o, conv); } catch(e){ console.warn('오브젝트 그리기 실패', o, e); }
  }
  return await out.save();
}

// 뷰공간에서 중심 기준 회전 후 pdf 좌표/각도 산출
function bakeGeom(o, conv) {
  const cx=o.x+o.w/2, cy=o.y+o.h/2;
  const th=(o.rot||0)*Math.PI/180, cs=Math.cos(th), sn=Math.sin(th);
  const C = conv(cx, cy);
  const D = conv(cx+cs, cy+sn);   // 방향점
  const alpha = Math.atan2(D.y-C.y, D.x-C.x);   // pdf CCW rad
  return { cx, cy, th, cs, sn, C, alpha, alphaDeg: alpha*180/Math.PI };
}
function rotVec(vx,vy,a){ const c=Math.cos(a), s=Math.sin(a); return { x:vx*c-vy*s, y:vx*s+vy*c }; }

// 모자이크용 페이지 래스터 (bakePage당 1회 렌더·재사용)
let _mosaicPjs=null, _mosaicRaster=null;
async function getMosaicRaster(){
  if (_mosaicRaster) return _mosaicRaster;
  const R=2; const vpR=_mosaicPjs.getViewport({ scale:R, rotation:0 });
  const cv=document.createElement('canvas'); cv.width=Math.ceil(vpR.width); cv.height=Math.ceil(vpR.height);
  await _mosaicPjs.render({ canvasContext:cv.getContext('2d'), viewport:vpR }).promise;
  _mosaicRaster={ cv, R }; return _mosaicRaster;
}

// 선 끝모양(캡) 굽기. P=끝점(pdf), dir=바깥방향(pdf CCW rad)
function drawCap(pg, type, P, dir, o) {
  if (!type || type==='none') return;
  const col=hexToRgb(o.fill||'#111111');
  const L=Math.max(7, (o.h||2)*3.5), lw=Math.max(1,(o.h||2));
  if (type==='arrow') {
    const a1=dir+Math.PI+0.42, a2=dir+Math.PI-0.42;
    pg.drawLine({ start:P, end:{x:P.x+L*Math.cos(a1), y:P.y+L*Math.sin(a1)}, thickness:lw, color:col });
    pg.drawLine({ start:P, end:{x:P.x+L*Math.cos(a2), y:P.y+L*Math.sin(a2)}, thickness:lw, color:col });
  } else if (type==='filledArrow') {
    const a1=dir+Math.PI+0.42, a2=dir+Math.PI-0.42;
    const b1={x:P.x+L*Math.cos(a1), y:P.y+L*Math.sin(a1)}, b2={x:P.x+L*Math.cos(a2), y:P.y+L*Math.sin(a2)};
    // drawSvgPath는 y-down(SVG) 규약 → pdf y를 음수로 넣으면 (sx,-sy)로 매핑돼 제자리에 채워진다
    pg.drawSvgPath(`M ${P.x} ${-P.y} L ${b1.x} ${-b1.y} L ${b2.x} ${-b2.y} Z`, { x:0, y:0, color:col });
  } else if (type==='circle') {
    pg.drawEllipse({ x:P.x, y:P.y, xScale:L*0.5, yScale:L*0.5, color:col });
  } else if (type==='square') {
    const s=L*0.9, ll=rotVec(-s/2,-s/2,dir);
    pg.drawRectangle({ x:P.x+ll.x, y:P.y+ll.y, width:s, height:s, rotate:degrees(dir*180/Math.PI), color:col });
  }
}

async function drawObj(out, pg, o, conv) {
  const g = bakeGeom(o, conv);
  if (o.type==='rect') {
    const fill = o.isLine ? (o.fill||'#111111') : o.fill;
    // 채움
    if (fill && fill!=='none') {
      const ll = rotVec(-o.w/2, -o.h/2, g.alpha);
      pg.drawRectangle({ x:g.C.x+ll.x, y:g.C.y+ll.y, width:o.w, height:o.h, rotate:degrees(g.alphaDeg), color:hexToRgb(fill) });
    }
    if (!o.isLine && o.strokeW>0 && o.stroke) {
      const ll = rotVec(-o.w/2, -o.h/2, g.alpha);
      pg.drawRectangle({ x:g.C.x+ll.x, y:g.C.y+ll.y, width:o.w, height:o.h, rotate:degrees(g.alphaDeg),
        borderColor:hexToRgb(o.stroke), borderWidth:o.strokeW, color:undefined });
    }
    if (o.isLine) {   // 양 끝 캡
      const sPt = { x:g.C.x+rotVec(-o.w/2,0,g.alpha).x, y:g.C.y+rotVec(-o.w/2,0,g.alpha).y };
      const ePt = { x:g.C.x+rotVec( o.w/2,0,g.alpha).x, y:g.C.y+rotVec( o.w/2,0,g.alpha).y };
      drawCap(pg, o.startCap, sPt, g.alpha+Math.PI, o);
      drawCap(pg, o.endCap,   ePt, g.alpha,          o);
    }
    return;
  }
  if (o.type==='shape') {
    const cx=o.x+o.w/2, cy=o.y+o.h/2, th=(o.rot||0)*Math.PI/180, cs=Math.cos(th), sn=Math.sin(th);
    const v=(SHAPES[o.shape]||SHAPES.ellipse).verts(o.w, o.h);
    const d='M '+v.map(([lx,ly])=>{ const vx=o.x+lx, vy=o.y+ly;
      const rx=cx+(vx-cx)*cs-(vy-cy)*sn, ry=cy+(vx-cx)*sn+(vy-cy)*cs; const p=conv(rx,ry);
      return p.x.toFixed(2)+' '+(-p.y).toFixed(2); }).join(' L ')+' Z';
    const opts={ x:0, y:0 };
    if (o.fill && o.fill!=='none') opts.color=hexToRgb(o.fill);
    if (o.stroke && o.strokeW>0) { opts.borderColor=hexToRgb(o.stroke); opts.borderWidth=o.strokeW; }
    if (!opts.color && !opts.borderColor) { opts.borderColor=hexToRgb('#1d1d1f'); opts.borderWidth=1; }
    pg.drawSvgPath(d, opts);
    return;
  }
  if (o.type==='mosaic') {
    const { cv, R } = await getMosaicRaster();
    const sx=Math.round(o.x*R), sy=Math.round(o.y*R), sw=Math.max(1,Math.round(o.w*R)), sh=Math.max(1,Math.round(o.h*R));
    const cell=Math.max(2,(o.cell||8));
    const bw=Math.max(1,Math.round(o.w/cell)), bh=Math.max(1,Math.round(o.h/cell));
    const tmp=document.createElement('canvas'); tmp.width=bw; tmp.height=bh;
    tmp.getContext('2d').drawImage(cv, sx,sy,sw,sh, 0,0,bw,bh);
    const o2=document.createElement('canvas'); o2.width=sw; o2.height=sh;
    const octx=o2.getContext('2d'); octx.imageSmoothingEnabled=false; octx.drawImage(tmp,0,0,bw,bh,0,0,sw,sh);
    const img=await out.embedPng(dataUrlToBytes(o2.toDataURL('image/png')));
    const ll=rotVec(-o.w/2,-o.h/2,g.alpha);
    pg.drawImage(img,{ x:g.C.x+ll.x, y:g.C.y+ll.y, width:o.w, height:o.h, rotate:degrees(g.alphaDeg) });
    return;
  }
  if (o.type==='image') {
    let bytes, isPng = /^data:image\/png/i.test(o.dataUrl);
    const cr = o.crop||{l:0,t:0,r:0,b:0};
    if (cr.l||cr.t||cr.r||cr.b) { const cropped = await cropDataUrl(o.dataUrl, cr, isPng); bytes=cropped.bytes; isPng=cropped.isPng; }
    else bytes = dataUrlToBytes(o.dataUrl);
    const img = isPng ? await out.embedPng(bytes) : await out.embedJpg(bytes);
    const ll = rotVec(-o.w/2, -o.h/2, g.alpha);
    pg.drawImage(img, { x:g.C.x+ll.x, y:g.C.y+ll.y, width:o.w, height:o.h, rotate:degrees(g.alphaDeg) });
    return;
  }
  if (o.type==='text' || o.type==='redactText') {
    if (o.type==='redactText') {
      const ll = rotVec(-o.w/2, -o.h/2, g.alpha);
      pg.drawRectangle({ x:g.C.x+ll.x, y:g.C.y+ll.y, width:o.w, height:o.h, rotate:degrees(g.alphaDeg), color:hexToRgb(o.bg||'#ffffff') });
    }
    const text = o.text||''; if (!text) return;
    const font = await loadPdfLibFont(out, o.fontPath, !isAscii(text));
    const size = o.fontSize;
    const ascent = size*0.8;
    // 정렬 오프셋(뷰공간 x)
    let offX = 0;
    try { const tw = font.widthOfTextAtSize(text, size); if (o.align==='center') offX=(o.w-tw)/2; else if(o.align==='right') offX=(o.w-tw); } catch(e){}
    // 뷰공간 기준: 텍스트 baseline-left = 박스(-w/2, -h/2+ascent) 중심기준, 회전 적용
    const rel = { x:-o.w/2+offX, y:-o.h/2+ascent };
    const rv = { x: rel.x*g.cs - rel.y*g.sn, y: rel.x*g.sn + rel.y*g.cs };
    const P = conv(g.cx+rv.x, g.cy+rv.y);
    pg.drawText(text, { x:P.x, y:P.y, size, font, color:hexToRgb(o.color||'#111111'), rotate:degrees(g.alphaDeg),
      lineHeight:size*1.05 });
    return;
  }
}

function dataUrlToBytes(dataUrl){ const b=atob(dataUrl.split(',')[1]); const u=new Uint8Array(b.length); for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i); return u; }
async function cropDataUrl(dataUrl, cr, wasPng){
  const img = await new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=dataUrl; });
  const sx=cr.l*img.width, sy=cr.t*img.height, sw=(1-cr.l-cr.r)*img.width, sh=(1-cr.t-cr.b)*img.height;
  const cv=document.createElement('canvas'); cv.width=Math.max(1,Math.round(sw)); cv.height=Math.max(1,Math.round(sh));
  cv.getContext('2d').drawImage(img, sx,sy,sw,sh, 0,0,cv.width,cv.height);
  const url = wasPng ? cv.toDataURL('image/png') : cv.toDataURL('image/jpeg',0.92);
  return { bytes:dataUrlToBytes(url), isPng:wasPng };
}
